version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AIGIS_API_KEY=${AIGIS_API_KEY:-}
      - AIGIS_API_HOST=0.0.0.0
      - AIGIS_API_PORT=8080
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped

  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npm install -g pnpm && pnpm install && pnpm exec vite --port 5173 --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    restart: unless-stopped
    depends_on:
      - api
