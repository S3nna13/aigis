version: "1"
aigis: guard
name: "hallucination-guard"
description: "OWASP LLM05 — RAG-grounded hallucination detection"

model:
  provider: openai
  model: gpt-4o-mini

guard:
  rails:
    output:
      - hallucination

  hallucination:
    threshold: 0.5
    use_rag_grounding: true

actions:
  hallucination: block

report:
  format: json
  output_path: ./reports