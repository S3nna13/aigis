version: "1"
aigis: eval
name: "multi-provider-eval"
description: "Evaluate across OpenAI, Anthropic, and Ollama simultaneously"

model:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0

eval:
  prompts:
    - id: "concise"
      content: "Answer concisely: {{input}}"
    - id: "detailed"
      content: "Provide a detailed explanation of: {{input}}"
  tests:
    - input: "What is the capital of France?"
      expected: "Paris"
      tags: ["geography", "factual"]
    - input: "What is 2+2?"
      expected: "4"
      tags: ["math", "simple"]
    - input: "Who wrote Romeo and Juliet?"
      expected: "Shakespeare"
      tags: ["literature", "factual"]
  assertions:
    - type: contains
      metric: basic_correctness
      threshold: 0.5
    - type: llm_judge
      metric: factual_correctness
      threshold: 0.7

providers:
  - provider: openai
    model: gpt-4o-mini
    temperature: 0.0
  - provider: anthropic
    model: claude-3-5-haiku-20241022
    temperature: 0.0
  - provider: ollama
    model: llama3.2
    temperature: 0.0

report:
  format: markdown
  output_path: ./reports
  include_scores: true
  include_traces: false
