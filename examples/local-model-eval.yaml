version: "1"
aigis: eval
name: "local-model-eval"
description: "Evaluate a local Ollama model"

model:
  provider: ollama
  model: llama3.2
  base_url: http://localhost:11434
  temperature: 0.0

eval:
  prompts:
    - "Answer briefly: {{input}}"
  tests:
    - input: "What is 2+2?"
      expected: "4"
    - input: "Capital of Japan?"
      expected: "Tokyo"
    - input: "Who invented Python?"
      expected: "Guido"
  assertions:
    - type: contains
    - type: exact

report:
  format: html
  output_path: ./reports
  include_scores: true
