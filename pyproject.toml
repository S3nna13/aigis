[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aigis"
version = "0.2.0"
description = "AI Guardrail & Integration System — unified eval, safety, and agent harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "aigis contributors" }]
keywords = ["ai", "guardrails", "evaluation", "llm", "safety", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
packages = [{ include = "aigis" }]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.0",
    "tomli>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.1"]
all = ["aigis[openai,anthropic,ollama]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.8", "httpx"]

[project.scripts]
aigis = "aigis.cli.main:cli"

[project.urls]
Homepage = "https://github.com/S3nna13/aigis"
Documentation = "https://github.com/S3nna13/aigis#readme"
Repository = "https://github.com/S3nna13/aigis"
Issues = "https://github.com/S3nna13/aigis/issues"

[tool.hatch.build.targets.wheel]
packages = ["aigis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]
