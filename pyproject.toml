[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aigis"
version = "0.1.0"
description = "AI Guardrail & Integration System — unified eval, safety, and agent harness"
authors = [{ name = "aigis" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.0",
    "tomli>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.1"]
all = ["aigis[openai,anthropic,ollama]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.8"]

[project.scripts]
aigis = "aigis.cli.main:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]
